services:
  mysql:
    image: mysql:8.4
    container_name: opencrm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: opencrm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-pcrm_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opencrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opencrm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: crm_password
      DB_NAME: opencrm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecret_jwt_key_crm_development_replace_in_prod_12345
      JWT_REFRESH_SECRET: supersecret_refresh_jwt_key_crm_development_replace_in_prod_54321
      JWT_EXPIRES_IN: 900s
      JWT_REFRESH_EXPIRES_IN: 7d
      DEFAULT_CURRENCY: BRL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opencrm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # Run once: docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opencrm-seed
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: crm_user
      DB_PASSWORD: crm_password
      DB_NAME: opencrm
    command: ["node", "dist/database/seed.js"]

volumes:
  mysql_data:
  redis_data:
